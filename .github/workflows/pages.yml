name: GitHub Pages — TRENDS YOUNIQUE project preview

# Production storefront ab Vercel project `trends-younique` se serve hota hai:
#   https://trends-younique.vercel.app  ->  https://trendsyounique.fashion (Cloudflare DNS)
# Ye workflow sirf GitHub Pages ka PROJECT PREVIEW banata hai:
#   https://mystorebyme.github.io/manoj-Product/
# Custom domain / root CNAME / Pages cname-attach yahan se hata diye gaye hain, taaki
# do platforms ek hi domain claim na karein.
#
# `main` par push = build + deploy. Session branch par sirf build (verification),
# kyunki `github-pages` environment sirf `main` se deploy allow karta hai.
# Actions tab se "Run workflow" bhi chal sakta hai.

on:
  push:
    branches:
      - main
      - arena/b064654c-manoj-product
    paths-ignore:
      - ".reviews-sync-trigger"
      - "database/seeds/reviews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: static build for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project page hamesha /<repo> base path par; custom domain claim nahi.
      - name: Resolve Pages URL + base path
        id: site
        run: |
          echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.STORE_API_URL }}
          NEXT_PUBLIC_LIVE_STORE_URL: ${{ vars.STORE_API_URL || 'https://trends-younique-storefront.onrender.com' }}
          # Preview ka canonical / OG / sitemap / robots project-page URL par
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
          NEXT_PUBLIC_CAMPAIGN_ID: diwali-2026
          NEXT_PUBLIC_CAMPAIGN_START: 2026-10-24T00:00:00+05:30
          NEXT_PUBLIC_CAMPAIGN_END: 2026-11-30T23:59:59+05:30
          NEXT_PUBLIC_GSC_VERIFICATION: hFaqyp-9LdUXSKPA9RF011TkO2m_-7AUMasXqm_0dGI
        run: node scripts/pages/build-preview.mjs

      - name: Ensure .nojekyll in artifact
        run: |
          touch dist/.nojekyll
          printf 'Pages URL: %s\nbase path: %s\n' \
            "${{ steps.site.outputs.site_url }}" \
            "${{ steps.site.outputs.base_path }}" >> "$GITHUB_STEP_SUMMARY"

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: dist
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy to github-pages project preview
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
