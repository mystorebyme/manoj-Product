name: GitHub Pages — TRENDS YOUNIQUE (custom domain)

# Asli storefront: TRENDS YOUNIQUE (Vercel deployment 7b164b36 se restore kiya gaya).
# Repo ka custom domain: trendsyounique.fashion (root `CNAME` + Settings → Pages).
# Isliye Pages build ROOT (/) par banti hai — koi `/<repo>` base path nahi.
# Canonical / OG / sitemap / robots / WhatsApp links bhi custom domain par hain.
#
# `main` par push = build + deploy. Session branch par sirf build (verification),
# kyunki `github-pages` environment sirf `main` se deploy allow karta hai.
# Actions tab se "Run workflow" bhi chal sakta hai.

on:
  push:
    branches:
      - main
      - arena/04883c02-manoj-product
    paths-ignore:
      - ".reviews-sync-trigger"
      - "database/seeds/reviews/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: static build for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CNAME ho to root deploy (custom domain), warna project page (/<repo>).
      - name: Resolve Pages URL + base path
        id: site
        run: |
          if [ -s CNAME ]; then
            domain="$(tr -d '\r\n[:space:]' < CNAME)"
            echo "domain=$domain" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$domain" >> "$GITHUB_OUTPUT"
          else
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Build static site
        env:
          PAGES_BASE_PATH: ${{ steps.site.outputs.base_path }}
          # Live store (Render) ka URL — Pages par checkout/payment/tracking isi API par jaate hain.
          # Repo → Settings → Variables → Actions me `STORE_API_URL` set karein.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.STORE_API_URL }}
          NEXT_PUBLIC_LIVE_STORE_URL: ${{ vars.STORE_API_URL || 'https://trends-younique-storefront.onrender.com' }}
          # canonical / OG / sitemap / robots / WhatsApp links custom domain par
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
          # Asli Vercel deployment jaisa Diwali campaign (flat 75% off, 24 Oct – 30 Nov 2026)
          NEXT_PUBLIC_CAMPAIGN_ID: diwali-2026
          NEXT_PUBLIC_CAMPAIGN_START: 2026-10-24T00:00:00+05:30
          NEXT_PUBLIC_CAMPAIGN_END: 2026-11-30T23:59:59+05:30
          NEXT_PUBLIC_GSC_VERIFICATION: hFaqyp-9LdUXSKPA9RF011TkO2m_-7AUMasXqm_0dGI
        run: node scripts/pages/build-preview.mjs

      # Har deployment me CNAME artifact ke root me hona chahiye, warna GitHub
      # custom domain setting drop kar deta hai aur site github.io par chal jaati hai.
      - name: Keep CNAME + .nojekyll in artifact
        run: |
          if [ -s CNAME ]; then cp CNAME dist/CNAME; fi
          touch dist/.nojekyll
          printf 'Pages URL: %s\nbase path: %s\n' \
            "${{ steps.site.outputs.site_url }}" \
            "${{ steps.site.outputs.base_path || '/' }}" >> "$GITHUB_STEP_SUMMARY"

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: dist
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy to trendsyounique.fashion
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
