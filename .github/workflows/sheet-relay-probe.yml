name: Sheet per-tab probe (temporary)

on:
  push:
    branches: [arena/e13f4af5-manoj-product]
    paths: [".github/workflows/sheet-relay-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Har tab par ek-ek row (asli headers ke saath)
        env:
          URL: https://script.google.com/macros/s/AKfycbwQxTH7BIhPkYvlTi7SWzUnh5WD2mP-AijXB2vrfLr9j3TvcD7fW3XtM4N9406VYDhO/exec
          TOKEN: tyw-cb77177528f9474049ffa98fead4cee1
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          send() { # $1 = json rows
            printf '%s' "{\"token\":\"$TOKEN\",\"action\":\"append\",\"rows\":$1}" > one.json
            echo "→ $1" | head -c 90; echo
            curl -sS --max-time 45 -X POST "$URL" -H 'content-type: text/plain;charset=UTF-8' --data-binary @one.json | head -c 250; echo
            sleep 2
          }

          send "[{\"sheet\":\"Orders\",\"row\":{\"Order ID\":\"TY-PROBE-ORD-$STAMP\",\"Date & Time\":\"$NOW\",\"Event\":\"probe\",\"Status\":\"test\",\"Customer\":\"probe\",\"Phone\":\"9000000000\",\"Items\":\"probe item x1\",\"Qty total\":1,\"Total ₹\":499,\"Payment method\":\"cod\",\"Source\":\"gh-probe\"}}]"

          send "[{\"sheet\":\"Order Items\",\"row\":{\"Order ID\":\"TY-PROBE-ORD-$STAMP\",\"Date & Time\":\"$NOW\",\"Product\":\"probe item\",\"Handle\":\"probe\",\"Size\":\"M\",\"Qty\":1,\"Price ₹\":499,\"Line total ₹\":499}}]"

          send "[{\"sheet\":\"Enquiries\",\"row\":{\"Date & Time\":\"$NOW\",\"Enquiry ID\":\"TY-PROBE-ENQ-$STAMP\",\"Type\":\"product\",\"Customer\":\"probe\",\"Phone\":\"9000000000\",\"Items\":\"probe item x1\",\"Qty total\":1,\"Value ₹\":499,\"Message\":\"enquiry probe\",\"Source page\":\"/products/probe\"}}]"

          send "[{\"sheet\":\"Newsletter\",\"row\":{\"Timestamp\":\"$NOW\",\"Email\":\"probe-$STAMP@example.com\",\"Source\":\"gh-probe\"}}]"

          send "[{\"sheet\":\"Reviews\",\"row\":{\"Timestamp\":\"$NOW\",\"Handle\":\"probe\",\"Product\":\"probe item\",\"Name\":\"probe\",\"Rating\":5,\"Title\":\"probe\",\"Body\":\"probe $STAMP\",\"Status\":\"pending\"}}]"

          send "[{\"sheet\":\"Payments\",\"row\":{\"Timestamp\":\"$NOW\",\"Event\":\"probe\",\"Order ID\":\"TY-PROBE-ORD-$STAMP\",\"Status\":\"test\",\"Customer\":\"probe\",\"Total ₹\":499,\"Method\":\"cod\"}}]"
          echo "STAMP $STAMP"
