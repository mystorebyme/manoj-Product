name: Sheet relay probe (temporary)

on:
  push:
    branches: [arena/e13f4af5-manoj-product]
    paths: [".github/workflows/sheet-relay-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relay payload jaisa hi bhejo (Messages + Enquiries)
        env:
          URL: https://script.google.com/macros/s/AKfycbwQxTH7BIhPkYvlTi7SWzUnh5WD2mP-AijXB2vrfLr9j3TvcD7fW3XtM4N9406VYDhO/exec
          TOKEN: tyw-cb77177528f9474049ffa98fead4cee1
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          cat > body.json <<JSON
          {"token":"$TOKEN","action":"append","rows":[
            {"sheet":"Messages","row":{"Name":"GH relay probe","Email":"probe@example.com","Phone":"9000000000","Message":"relay probe $STAMP","Source":"gh-relay-probe","Date & Time":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}},
            {"sheet":"Enquiries","row":{"Enquiry ID":"TY-RELAYPROBE-$STAMP","Date & Time":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","Product":"probe","Name":"GH relay probe","Phone":"9000000000","Message":"relay probe","Source":"gh-relay-probe"}}
          ]}
          JSON
          echo "--- POST (beacon jaisa text/plain JSON) ---"
          curl -sS --max-time 45 -X POST "$URL" -H 'content-type: text/plain;charset=UTF-8' --data-binary @body.json | head -c 300; echo
          echo "--- POST form-encoded (sendViaForm jaisa) ---"
          curl -sS --max-time 45 -X POST "$URL" --data-urlencode "token=$TOKEN" --data-urlencode "action=append" --data-urlencode "rows=[{\"sheet\":\"Messages\",\"row\":{\"Name\":\"GH form probe\",\"Email\":\"probe@example.com\",\"Phone\":\"9000000000\",\"Message\":\"form probe $STAMP\",\"Source\":\"gh-relay-probe\"}}]" | head -c 300; echo
          echo "STAMP $STAMP"
